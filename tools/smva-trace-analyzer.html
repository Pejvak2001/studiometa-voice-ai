<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMVA Trace Analyzer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --ink: #e6e9ef;
    --dim: #8b93a5; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: 13px; }
  textarea { width: 100%; height: 130px; background: var(--panel); color: var(--ink);
             border: 1px solid var(--line); border-radius: 8px; padding: 12px;
             font: 12px/1.5 var(--mono); resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0 28px; flex-wrap: wrap; }
  button { background: var(--accent); color: #06101f; border: 0; border-radius: 7px;
           padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  input[type=file] { color: var(--dim); font-size: 12px; }
  .call { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 20px; }
  .call h2 { font-size: 15px; margin: 0 0 2px; }
  .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); margin-bottom: 16px; }
  .verdict { list-style: none; padding: 0; margin: 0 0 18px; }
  .verdict li { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px;
                border-left: 3px solid var(--line); background: #1c2029; }
  .verdict li.bad  { border-left-color: var(--bad);  }
  .verdict li.warn { border-left-color: var(--warn); }
  .verdict li.ok   { border-left-color: var(--ok);   }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; text-align: right; font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  td.bad { color: var(--bad); font-weight: 600; }
  td.warn { color: var(--warn); font-weight: 600; }
  td.ok { color: var(--ok); }
  .scroll { overflow-x: auto; margin-bottom: 20px; }
  .legend { color: var(--dim); font-size: 11px; font-family: var(--mono); margin: 6px 0 20px; }
  .empty { color: var(--dim); text-align: center; padding: 50px 0; }
  svg { display: block; width: 100%; height: auto; }
  .hist { display: flex; gap: 3px; align-items: flex-end; height: 64px; }
  .hist i { flex: 1; background: var(--accent); opacity: .8; border-radius: 2px 2px 0 0; min-height: 1px; }
  .hist i.late { background: var(--bad); }
  .histlab { display: flex; gap: 3px; margin-top: 4px; }
  .histlab i { flex: 1; text-align: center; font-style: normal; color: var(--dim);
               font-size: 10px; font-family: var(--mono); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--dim); margin: 22px 0 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SMVA Trace Analyzer</h1>
  <p class="sub">Paste the output of <code>SMVATrace.copy()</code> from the visitor's browser console, or load a saved <code>.json</code> file.</p>

  <textarea id="input" placeholder='{ "format": "smva-trace/1", "calls": [ ... ] }'></textarea>
  <div class="row">
    <button id="go">Analyze</button>
    <input type="file" id="file" accept=".json,application/json">
    <button class="ghost" id="demo">Load sample</button>
  </div>

  <div id="out"><div class="empty">No trace loaded yet.</div></div>
</div>

<script>
'use strict';

var GAP_LABELS = ['&lt;20', '&lt;50', '&lt;100', '&lt;200', '&lt;400', '&lt;800', '800+'];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function n(v, dp) {
  if (v === null || v === undefined) return '—';
  return typeof v === 'number' ? v.toFixed(dp === undefined ? 0 : dp) : esc(v);
}

// Mirrors traceVerdict() in widget.js. Kept here as well so an old trace can
// still be judged by current thresholds without re-running the widget.
function verdict(call) {
  var out = [];
  var reps = call.replies || [];
  var rated = reps.filter(function (r) { return r.deliveryRatio !== null && r.deliveryRatio !== undefined; });

  if (!reps.length) out.push(['bad', 'NO AUDIO — the agent never sent any audio in this call.']);

  var slow = rated.filter(function (r) { return r.deliveryRatio < 1; });
  if (slow.length) {
    var worst = Math.min.apply(null, slow.map(function (r) { return r.deliveryRatio; }));
    out.push(['bad', 'UPSTREAM — ' + slow.length + '/' + rated.length +
      ' replies arrived slower than realtime (worst ratio ' + worst + '). ' +
      'The stream cannot sustain playback speed; no local buffer size fixes this. Look at the backend or the network path.']);
  } else if (rated.length) {
    // Worth stating outright: it rules out the whole "we need a faster server
    // / a better machine" branch, which is where the guessing usually starts.
    var lowest = Math.min.apply(null, rated.map(function (r) { return r.deliveryRatio; }));
    out.push(['ok', 'DELIVERY OK — every reply arrived at or above realtime (slowest ' + lowest +
      '×). Neither the network nor the backend is the bottleneck; any stutter here is local scheduling.']);
  }
  var bursty = rated.filter(function (r) { return r.gapP95 > 300; });
  if (bursty.length) {
    out.push(['warn', 'JITTER — ' + bursty.length + '/' + rated.length +
      ' replies had p95 arrival gaps over 300ms. Enough audio arrived, but in bursts. A larger start cushion absorbs this.']);
  }
  var under = reps.reduce(function (a, r) { return a + (r.underruns || 0); }, 0);
  if (under) out.push(['bad', 'UNDERRUNS — ' + under + ' total. Playback ran dry and the listener heard a break.']);

  // Seams are the harmless case underruns used to be confused with: the
  // timeline joining one burst to the next. They are reported so their
  // absence or presence is visible, never as a fault.
  var seams = reps.reduce(function (a, r) { return a + (r.seams || 0); }, 0);
  if (seams) out.push(['ok', 'SEAMS — ' + seams + ' timeline joins, all below the 50ms audibility floor. Expected and harmless.']);

  var early = reps.filter(function (r) { return r.reply <= 2 && r.underruns > 0; });
  if (early.length) {
    out.push(['warn', 'EARLY-CALL — the break landed in the first two replies, when the adaptive cushion is still at its floor. ' +
      'This is the demo-failure signature: a fresh page load starts the cushion at its minimum.']);
  }
  var tightPrime = reps.filter(function (r) {
    return r.primeWaitMs !== null && r.primeQueuedMs !== null && r.primeQueuedMs < 250;
  });
  if (tightPrime.length) {
    out.push(['warn', 'THIN PRE-ROLL — ' + tightPrime.length + '/' + reps.length +
      ' replies began playing with under 250ms buffered. The pre-roll timed out before reaching its target.']);
  }
  if (call.micChunks === 0) {
    out.push(['bad', 'MIC DEAD — no audio was captured at all. The microphone path failed; this is not a network problem.']);
  } else if (call.micBuckets && call.micQuietBuckets / call.micBuckets > 0.9) {
    out.push(['warn', 'MIC QUIET — ' + call.micQuietBuckets + '/' + call.micBuckets +
      ' half-second windows were near-silent. Check the input device or its gain.']);
  }
  var ints = reps.reduce(function (a, r) { return a + (r.interrupts || 0); }, 0);
  if (ints > 2) out.push(['warn', 'BARGE-IN — ' + ints + ' interrupts. Room noise or speaker echo may be cutting the agent off.']);

  if (call.wsCloseCode && call.wsCloseCode !== 1000 && call.wsCloseCode !== 1005) {
    out.push(['bad', 'WS CLOSE — code ' + call.wsCloseCode + '; the connection did not close cleanly.']);
  }
  if (!out.length) out.push(['ok', 'CLEAN — audio arrived at or above realtime with no underruns.']);
  return out;
}

function replyTable(reps) {
  if (!reps.length) return '<p class="legend">No replies recorded.</p>';
  var head = ['Reply', 'Chunks', 'KB', 'Audio ms', 'Wall ms', 'Ratio', 'Gap p50', 'Gap p95', 'Gap max',
              'Min ahead', 'Pre-roll', 'Buffered', 'Cushion', 'Under', 'Seam', 'Int'];
  var rows = reps.map(function (r) {
    var ratioCls = r.deliveryRatio === null || r.deliveryRatio === undefined ? ''
                 : r.deliveryRatio < 1 ? 'bad' : r.deliveryRatio < 1.05 ? 'warn' : 'ok';
    var p95Cls = r.gapP95 > 300 ? 'bad' : r.gapP95 > 150 ? 'warn' : '';
    var aheadCls = r.minLookaheadMs === null ? '' : r.minLookaheadMs < 80 ? 'bad' : r.minLookaheadMs < 200 ? 'warn' : '';
    var bufCls = r.primeQueuedMs === null || r.primeQueuedMs === undefined ? ''
               : r.primeQueuedMs < 250 ? 'warn' : '';
    return '<tr>' +
      '<td>#' + r.reply + '</td>' +
      '<td>' + n(r.chunks) + '</td>' +
      '<td>' + n(r.kb, 1) + '</td>' +
      '<td>' + n(r.audioMs) + '</td>' +
      '<td>' + n(r.wallMs) + '</td>' +
      '<td class="' + ratioCls + '">' + (r.deliveryRatio == null ? '—' : r.deliveryRatio.toFixed(2)) + '</td>' +
      '<td>' + n(r.gapP50, 1) + '</td>' +
      '<td class="' + p95Cls + '">' + n(r.gapP95, 1) + '</td>' +
      '<td>' + n(r.gapMax, 1) + '</td>' +
      '<td class="' + aheadCls + '">' + n(r.minLookaheadMs) + '</td>' +
      '<td>' + n(r.primeWaitMs) + '</td>' +
      '<td class="' + bufCls + '">' + n(r.primeQueuedMs) + '</td>' +
      '<td>' + n(r.startBufferMs) + '</td>' +
      '<td class="' + (r.underruns ? 'bad' : '') + '">' + n(r.underruns) + '</td>' +
      '<td>' + n(r.seams || 0) + '</td>' +
      '<td class="' + (r.interrupts ? 'warn' : '') + '">' + n(r.interrupts) + '</td>' +
      '</tr>';
  }).join('');
  return '<div class="scroll"><table><thead><tr>' +
    head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="legend">Ratio = audio ms delivered / wall ms elapsed. Below 1.00 the network cannot keep up with playback. ' +
    '&nbsp;·&nbsp; Min ahead = smallest scheduled lookahead; under ~80ms the reply was one hiccup from a gap. ' +
    '&nbsp;·&nbsp; Buffered = audio queued when the pre-roll released, against its 350ms target.</p>';
}

function histogram(reps) {
  var totals = [0, 0, 0, 0, 0, 0, 0];
  reps.forEach(function (r) {
    (r.gapHist || []).forEach(function (v, i) { totals[i] += v; });
  });
  var max = Math.max.apply(null, totals) || 1;
  var sum = totals.reduce(function (a, b) { return a + b; }, 0);
  if (!sum) return '';
  var bars = totals.map(function (v, i) {
    return '<i class="' + (i >= 4 ? 'late' : '') + '" style="height:' +
      Math.max(1, Math.round((v / max) * 100)) + '%" title="' +
      GAP_LABELS[i].replace('&lt;', '<') + ' ms: ' + v + '"></i>';
  }).join('');
  var labels = GAP_LABELS.map(function (l) { return '<i>' + l + '</i>'; }).join('');
  return '<h3>Chunk arrival gaps (all replies)</h3>' +
    '<div class="hist">' + bars + '</div>' +
    '<div class="histlab">' + labels + '</div>' +
    '<p class="legend">Red bars are gaps of 400ms or more. A healthy stream is concentrated in the left buckets; ' +
    'weight on the right is the burstiness that empties the buffer.</p>';
}

function timeline(call) {
  var evs = call.events || [];
  if (!evs.length) return '';
  var dur = call.durationMs || (evs.length ? evs[evs.length - 1].t - evs[0].t : 0);
  if (dur <= 0) return '';
  var t0 = evs[0].t;
  var W = 1100, H = 132, PAD = 34;
  var x = function (t) { return PAD + ((t - t0) / dur) * (W - PAD - 12); };

  var lanes = [
    { key: 'mic',       y: 24,  label: 'mic',    color: '#3fb950' },
    { key: 'rx_gap',    y: 54,  label: 'gaps',   color: '#d29922' },
    { key: 'underrun',  y: 84,  label: 'under',  color: '#f85149' },
    { key: 'interrupt', y: 108, label: 'int',    color: '#a371f7' }
  ];

  var parts = [];
  // Reply spans give the eye something to anchor the marks against.
  var open = null;
  evs.forEach(function (e) {
    if (e.type === 'reply_start') open = e.t;
    else if (e.type === 'reply_end' && open !== null) {
      parts.push('<rect x="' + x(open).toFixed(1) + '" y="12" width="' +
        Math.max(1, x(e.t) - x(open)).toFixed(1) + '" height="' + (H - 22) +
        '" fill="#58a6ff" opacity="0.07"/>');
      open = null;
    }
  });

  lanes.forEach(function (lane) {
    parts.push('<text x="4" y="' + (lane.y + 4) + '" fill="#8b93a5" font-size="10" font-family="monospace">' + lane.label + '</text>');
    parts.push('<line x1="' + PAD + '" y1="' + lane.y + '" x2="' + (W - 12) + '" y2="' + lane.y + '" stroke="#262b36"/>');
  });

  evs.forEach(function (e) {
    var lane = lanes.filter(function (l) { return l.key === e.type; })[0];
    if (!lane) return;
    var px = x(e.t);
    if (e.type === 'mic') {
      var hgt = Math.max(1, Math.min(11, ((e.peak || 0) / 32768) * 90));
      parts.push('<rect x="' + px.toFixed(1) + '" y="' + (lane.y - hgt).toFixed(1) +
        '" width="2" height="' + hgt.toFixed(1) + '" fill="' + lane.color + '" opacity="0.8"/>');
    } else {
      parts.push('<line x1="' + px.toFixed(1) + '" y1="' + (lane.y - 9) + '" x2="' + px.toFixed(1) +
        '" y2="' + (lane.y + 9) + '" stroke="' + lane.color + '" stroke-width="2"/>');
    }
  });

  for (var s = 0; s <= dur; s += Math.max(5000, Math.round(dur / 6 / 1000) * 1000)) {
    parts.push('<text x="' + x(t0 + s).toFixed(1) + '" y="' + (H - 2) +
      '" fill="#8b93a5" font-size="9" font-family="monospace">' + Math.round(s / 1000) + 's</text>');
  }

  return '<h3>Timeline</h3><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
    parts.join('') + '</svg>' +
    '<p class="legend">Blue bands are agent replies. Green bars are microphone level. ' +
    'Yellow marks are arrival gaps over 250ms, red are underruns, purple are barge-ins.</p>';
}

function renderCall(call, i, total) {
  var link = call.connectionStart
    ? call.connectionStart.effectiveType + ' · ' + call.connectionStart.downlinkMbps +
      ' Mbps · rtt ' + call.connectionStart.rttMs + 'ms'
    : 'link info unavailable (Safari/Firefox)';
  var meta = [
    'v' + esc(call.pluginVersion || '?'),
    Math.round((call.durationMs || 0) / 1000) + 's',
    (call.replies || []).length + ' replies',
    'mic ' + (call.micChunks || 0) + ' frames',
    'close ' + (call.wsCloseCode === null || call.wsCloseCode === undefined ? '—' : call.wsCloseCode),
    'reason ' + esc(call.reason || '—'),
    link
  ].join('  ·  ');

  return '<div class="call">' +
    '<h2>Call ' + (i + 1) + ' of ' + total + (call.inProgress ? ' (in progress)' : '') +
      ' — ' + esc(call.startedAt || '') + '</h2>' +
    '<div class="meta">' + esc(meta) + '</div>' +
    '<ul class="verdict">' + verdict(call).map(function (v) {
      return '<li class="' + v[0] + '">' + esc(v[1]) + '</li>';
    }).join('') + '</ul>' +
    replyTable(call.replies || []) +
    histogram(call.replies || []) +
    timeline(call) +
    '</div>';
}

function analyze(text) {
  var out = document.getElementById('out');
  var data;
  try { data = JSON.parse(text); }
  catch (e) { out.innerHTML = '<div class="empty">Could not parse JSON: ' + esc(e.message) + '</div>'; return; }

  var calls = data && data.calls ? data.calls : (Array.isArray(data) ? data : null);
  if (!calls || !calls.length) { out.innerHTML = '<div class="empty">No calls found in this trace.</div>'; return; }

  out.innerHTML = calls.map(function (c, i) { return renderCall(c, i, calls.length); }).join('');
}

document.getElementById('go').addEventListener('click', function () {
  analyze(document.getElementById('input').value);
});
document.getElementById('file').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    document.getElementById('input').value = fr.result;
    analyze(fr.result);
  };
  fr.readAsText(f);
});
document.getElementById('demo').addEventListener('click', function () {
  // A synthetic trace showing the exact failure this tool was built to catch:
  // reply #1 delivered below realtime with a thin pre-roll, then recovery.
  var sample = {
    format: 'smva-trace/1', pluginVersion: '1.3.83', generatedAt: new Date().toISOString(),
    calls: [{
      sessionId: 'smva_sample', pluginVersion: '1.3.83', startedAt: new Date().toISOString(),
      durationMs: 42000, micChunks: 2100, micBuckets: 84, micQuietBuckets: 31,
      wsCloseCode: 1000, reason: 'user_ended',
      connectionStart: { effectiveType: '4g', downlinkMbps: 9.4, rttMs: 150 },
      replies: [
        { reply: 1, chunks: 41, kb: 121.4, audioMs: 2580, wallMs: 3120, deliveryRatio: 0.83,
          gapP50: 42.1, gapP95: 486.3, gapMax: 731.0, gapHist: [8, 14, 9, 4, 3, 2, 1],
          underruns: 2, interrupts: 0, primeWaitMs: 300, primeQueuedMs: 118,
          startBufferMs: 240, minLookaheadMs: 0 },
        { reply: 2, chunks: 63, kb: 188.2, audioMs: 4010, wallMs: 3980, deliveryRatio: 1.01,
          gapP50: 38.0, gapP95: 210.4, gapMax: 288.0, gapHist: [21, 25, 10, 5, 2, 0, 0],
          underruns: 0, interrupts: 0, primeWaitMs: 210, primeQueuedMs: 352,
          startBufferMs: 440, minLookaheadMs: 265 },
        { reply: 3, chunks: 58, kb: 173.0, audioMs: 3690, wallMs: 3610, deliveryRatio: 1.02,
          gapP50: 35.5, gapP95: 121.0, gapMax: 190.2, gapHist: [24, 22, 9, 2, 0, 0, 0],
          underruns: 0, interrupts: 1, primeWaitMs: 165, primeQueuedMs: 361,
          startBufferMs: 420, minLookaheadMs: 310 }
      ],
      events: [
        { t: 0, type: 'call_start', startBufferMs: 240 },
        { t: 240, type: 'mic_ready', waitMs: 240 },
        { t: 690, type: 'ws_open', connectMs: 450 },
        { t: 1400, type: 'reply_start', reply: 1 },
        { t: 1700, type: 'prime', waitMs: 300, queuedMs: 118, targetMs: 350, timedOut: true },
        { t: 2100, type: 'mic', n: 25, peak: 640, voicedPct: 4 },
        { t: 2600, type: 'rx_gap', reply: 1, gapMs: 486, chunk: 12 },
        { t: 2640, type: 'underrun', reply: 1, shortfallMs: 96, queueDepth: 0, newBufferMs: 340 },
        { t: 3300, type: 'rx_gap', reply: 1, gapMs: 731, chunk: 27 },
        { t: 3380, type: 'underrun', reply: 1, shortfallMs: 154, queueDepth: 0, newBufferMs: 440 },
        { t: 4520, type: 'reply_end', reply: 1 },
        { t: 9000, type: 'mic', n: 25, peak: 8200, voicedPct: 88 },
        { t: 9500, type: 'mic', n: 25, peak: 9100, voicedPct: 92 },
        { t: 12000, type: 'reply_start', reply: 2 },
        { t: 16000, type: 'reply_end', reply: 2 },
        { t: 24000, type: 'mic', n: 25, peak: 7400, voicedPct: 79 },
        { t: 27000, type: 'reply_start', reply: 3 },
        { t: 29500, type: 'interrupt', maxVal: 4100, sincePlaybackMs: 2400 },
        { t: 30600, type: 'reply_end', reply: 3 },
        { t: 42000, type: 'call_end', reason: 'user_ended', durationMs: 42000 }
      ]
    }]
  };
  var txt = JSON.stringify(sample, null, 2);
  document.getElementById('input').value = txt;
  analyze(txt);
});
</script>
</body>
</html>
